name: Deploy web (GitHub Pages)

# Build de la version web de GetExp et publication sur GitHub Pages.
# Active Pages automatiquement (enablement) — aucun réglage manuel requis.

on:
  push:
    branches: ["claude/tech-consulting-marketplace-EfEwV"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Set base URL (project page = /myprotos/)
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/myprotos'};require('fs').writeFileSync(f,JSON.stringify(j,null,2));"
      - name: Export web
        run: npx expo export -p web
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
