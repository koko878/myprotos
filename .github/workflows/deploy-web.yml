name: Deploy web (GitHub Pages)

# Build de la version web de GetExp et publication sur GitHub Pages.

on:
  push:
    branches: ["claude/tech-consulting-marketplace-EfEwV"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install deps
        run: npm install
      - name: Set base URL (project page = /myprotos/)
        run: |
          node -e "const f='app.json';const j=require('./'+f);j.expo.experiments={...(j.expo.experiments||{}),baseUrl:'/myprotos'};require('fs').writeFileSync(f,JSON.stringify(j,null,2));"
      - name: Export web
        run: npx expo export -p web

      # --- Diagnostic : tenter d'activer Pages et capturer la réponse HTTP ---
      - name: Try enable Pages
        id: enable
        continue-on-error: true
        run: |
          set +e
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          echo "HTTP=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/pages.json || true
      - name: Report diagnostic to an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY="$(printf 'Pages enable HTTP code: **%s**\n\nResponse body:\n\n```json\n%s\n```' "${{ steps.enable.outputs.code }}" "$(cat /tmp/pages.json 2>/dev/null)")"
          gh issue create --repo "${{ github.repository }}" --title "CI diag — pages enablement" --body "$BODY" || true

      - uses: actions/configure-pages@v5
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
